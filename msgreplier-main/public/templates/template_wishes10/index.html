<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday!</title>
    <meta name="description" content="Celebrate your day with joy and happiness!" />
    <!-- Google Font: Kalam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-Bwf8ADcb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DERIcU6Y.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        const defaults = ['images/1.png', 'images/2.png', 'images/3.png', 'images/4.png'];
        function replaceImages() {
          const imgs = document.querySelectorAll('img');
          imgs.forEach(img => {
            const src = img.getAttribute('src') || '';
            const isMatch = defaults.some(d => src.endsWith(d));
            if (isMatch) {
              const placeholder = document.createElement('div');
              placeholder.className = img.className;
              placeholder.style.cssText = img.style.cssText;
              placeholder.style.display = 'flex';
              placeholder.style.alignItems = 'center';
              placeholder.style.justifyContent = 'center';
              placeholder.style.background = '#c0c0c0';
              placeholder.style.border = '2px solid';
              placeholder.style.borderTopColor = '#fff';
              placeholder.style.borderLeftColor = '#fff';
              placeholder.style.borderRightColor = '#808080';
              placeholder.style.borderBottomColor = '#808080';
              placeholder.style.boxSizing = 'border-box';
              placeholder.style.padding = '10px';
              placeholder.style.width = img.width ? img.width + 'px' : '100%';
              placeholder.style.height = img.height ? img.height + 'px' : '100%';
              placeholder.style.minHeight = '140px';
              placeholder.style.aspectRatio = '1 / 1';
              placeholder.style.margin = 'auto';
              
              placeholder.innerHTML = `
                <div style="text-align: center; color: #000; font-family: monospace; font-size: 11px; font-weight: bold;">
                  <div style="font-size: 20px; margin-bottom: 4px;">🌸</div>
                  Example Image
                </div>
              `;
              img.parentNode.replaceChild(placeholder, img);
            }
          });
        }
        window.addEventListener('DOMContentLoaded', replaceImages);
        window.addEventListener('load', replaceImages);
        const observer = new MutationObserver(replaceImages);
        observer.observe(document.body || document.documentElement, {
          childList: true,
          subtree: true
        });
        replaceImages();
      })();
    </script>
  </body>
</html>
